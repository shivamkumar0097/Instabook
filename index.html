<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loginPage" class="page">
  <div class="login-box">
    <h1>facebook</h1>
    <input type="text" id="email" placeholder="Email">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="login()">Log in</button>
    <p onclick="showSignup()">Create account</p>
  </div>
</div>
<div id="signupPage" class="page hidden">
  <div class="login-box">
    <h2>Sign Up</h2>
    <input type="text" id="sname" placeholder="Name">
    <input type="text" id="semail" placeholder="Email">
    <input type="password" id="spass" placeholder="Password">
    <button onclick="signup()">Sign Up</button>
    <p onclick="showLogin()">Back</p>
  </div>
</div>
<div id="feedPage" class="hidden">
  <div class="top-bar">
    <span class="fb-logo">facebook</span>
    <div class="top-icons"><span>+</span><span>🔍</span><span>☰</span></div>
  </div>
  <div class="nav-bar">
    <span class="active">🏠</span><span>👥</span><span>💬</span><span>🔔</span><span>📺</span><span>🏪</span>
  </div>
  <div class="story-row">
    <div class="story add"><div class="story-img">+</div><span>Add to Story</span></div>
    <div class="story"><div class="story-img" style="background:#e74c3c;">S</div><span>Sam</span></div>
    <div class="story"><div class="story-img" style="background:#3498db;">K</div><span>Kaori</span></div>
  </div>
  <div class="post-create">
    <div class="avatar" id="myAvatar">U</div>
    <input type="text" id="postText" placeholder="What's on your mind?">
    <span onclick="createPost()">📷</span>
  </div>
  <div id="posts"></div>
  <div class="bottom-nav">
    <span>🏠</span><span>👥</span><span>➕</span><span>🔔</span><span>☰</span>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
